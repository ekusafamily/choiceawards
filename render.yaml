services:
  # ==========================================
  # 1. Backend Web Service (Node.js / Express)
  # ==========================================
  - type: web
    name: choiceawards-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ==========================================
  # 2. Frontend Static Site (React / Vite)
  # ==========================================
  - type: web
    name: choiceawards-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ADMIN_PASSCODE
        sync: false
